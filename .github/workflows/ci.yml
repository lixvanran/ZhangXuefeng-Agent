name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端静态校验 + 回归测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 这三个测试刻意只用标准库 + AST 静态分析, 不需要装三方依赖,
      # 所以 CI 不必跑 pip install(装依赖还会拖慢每次检查)。
      - name: 内部 import 解析 (查重构留下的悬空引用)
        run: python3 check_imports.py

      - name: 全量语法编译
        run: python3 -m compileall -q backend/app

      - name: 搜索调度回归测试
        run: python3 tests/test_search_scheduling.py

      - name: 知识库注册表测试
        run: python3 tests/test_kb_registry.py

      - name: 配置一致性检查 (死配置 / provider 契约 / 超时上限)
        run: python3 tests/test_config_consistency.py

  frontend:
    name: 前端类型检查 + 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: 构建
        run: npm run build
